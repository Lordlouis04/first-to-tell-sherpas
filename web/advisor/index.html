<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synapsis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Layout and visual language follow the Sherpas shared-plan pages: top tabs, a left section menu,
     Poppins display headings, Inter body, lavender hero card, indigo accent, flat sections. */
  :root{--canvas:#f8f9fc;--panel:#ffffff;--bar:#f8f9fc;--ink:#1b1c22;--ink-2:#3a3d4a;--muted:#646883;--faint:#9a9db2;
        --line:#e3e5ec;--line-2:#d3d6df;--brand:#4b55d0;--brand-ink:#fff;--hero-a:#eceffd;--hero-b:#e2e6fb;
        --red:#d0342c;--amber:#e08a1e;--green:#2f9e5b;--blue:#4b55d0;--sim:#6b4fc8;color-scheme:light}
  :root[data-theme="dark"]{--canvas:#111216;--panel:#191a20;--bar:#1d1e25;--ink:#ececf2;--ink-2:#c9cbd6;--muted:#9a9db2;--faint:#6d7085;
        --line:#2b2d37;--line-2:#383a46;--brand:#8a92ff;--brand-ink:#11121a;--hero-a:#23264a;--hero-b:#1e2140}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.6 Inter,ui-sans-serif,system-ui,sans-serif}
  h1,h2,h3{font-family:Poppins,ui-sans-serif,system-ui,sans-serif;letter-spacing:-.03em;margin:0;font-weight:600}
  a{color:var(--brand)}

  /* top bar: wordmark + view tabs (like "Advice | Living map") */
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 32px;height:64px}
  .wordmark{font:600 22px/64px Poppins,sans-serif;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
  .views{display:flex;gap:6px;height:100%}
  .views a{display:flex;align-items:center;padding:0 16px;color:var(--ink-2);text-decoration:none;font-weight:500;border-bottom:2px solid transparent}
  .views a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}

  /* white rounded sheet with left menu + content */
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;margin:0 16px;min-height:calc(100vh - 64px);
         display:grid;grid-template-columns:260px minmax(0,1fr);gap:0}
  .side{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:36px 12px 36px 28px}
  .side .grp{font:600 12px Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
  .side .it{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 0;color:var(--ink);font:600 15px/1.35 Inter,sans-serif;cursor:pointer}
  .side .it .n{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:6px}
  .side .it.dim{color:var(--ink-2);font-weight:500}
  .side .sub{border-left:1px solid var(--line-2);margin:4px 0 12px 12px;padding:2px 0}
  .side .sub button{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;margin-left:-1px;
                    padding:6px 0 6px 22px;color:var(--ink-2);font:400 14.5px/1.35 Inter,sans-serif;cursor:pointer}
  .side .sub button.on{color:var(--brand);border-left-color:var(--brand)}
  .side .sub button:hover,.side .it:hover{color:var(--brand)}
  main{padding:36px 40px 80px 12px;min-width:0}

  @media (max-width:880px){
    .topbar{padding:0 16px;height:auto;flex-wrap:wrap;align-items:center} .wordmark{line-height:52px}
    .views{height:44px;width:100%}
    .sheet{grid-template-columns:1fr;margin:0;border-radius:16px 16px 0 0}
    .side{position:sticky;top:0;z-index:5;background:var(--panel);max-height:none;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line)}
    .side .grp,.side .sub{display:none}
    .side .it{white-space:nowrap;width:auto;border:1px solid var(--line-2);border-radius:99px;padding:7px 12px;font-size:13.5px}
    .side .it:not(.dim){border-color:var(--brand);color:var(--brand)}
    main{padding:20px 16px 60px}
  }

  /* hero like the "Investment analysis" card */
  .hero{background:linear-gradient(120deg,var(--hero-a),var(--hero-b));border-radius:20px;padding:36px 40px}
  .hero h1{font-size:clamp(34px,5.5vw,60px);line-height:1.05}
  .hero p{margin:16px 0 0;color:var(--ink-2);font-size:16px;max-width:760px}
  .stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px}
  .stat b{display:block;font:600 30px/1.1 Poppins,sans-serif;letter-spacing:-.03em;color:var(--brand)} .stat span{font-size:13px;color:var(--muted)}
  @media (max-width:600px){.hero{padding:24px 20px}}
  .fine{font-size:12px;font-style:italic;color:var(--muted);margin:10px 4px 0}

  section{scroll-margin-top:16px}
  section > h2{font-size:clamp(26px,3.4vw,40px);line-height:1.1;margin:48px 0 6px}
  .lead{color:var(--muted);margin:0 0 18px;font-size:14.5px;max-width:760px}
  .tag{display:inline-block;font:600 11px/1 Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border-radius:99px;color:#fff;vertical-align:middle}
  .sim{background:var(--sim)} .high{background:var(--red)} .medium{background:var(--amber)} .low{background:var(--blue)} .none{background:var(--faint)}
  .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 0 16px;flex-wrap:wrap;color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1}

  /* draft cards */
  .card{border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px;background:var(--panel)}
  .card.approved{border-color:var(--green);box-shadow:inset 4px 0 0 var(--green)} .card.rejected{opacity:.5}
  .fam{font:600 20px/1.3 Poppins,sans-serif;letter-spacing:-.02em}
  .meta{color:var(--muted);font-size:13.5px}
  h3.label{font:600 15px/1.4 Inter,sans-serif;color:var(--brand);letter-spacing:0;margin:16px 0 6px}
  .why{color:var(--ink-2)}
  .figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:4px 0}
  .fig{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bar)}
  .fig b{display:block;font:600 18px/1.3 Poppins,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .fig span{font-size:12.5px;color:var(--muted);line-height:1.35;display:block}
  textarea{width:100%;min-height:170px;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line-2);background:var(--bar);color:var(--ink)}
  .msg{white-space:pre-wrap;margin:0;color:var(--ink)}
  .note{font-size:13px;color:var(--muted);margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bar)}
  button{font:600 14px/1 Inter,sans-serif;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);padding:10px 14px;cursor:pointer}
  button:hover{border-color:var(--brand)} button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .empty{color:var(--muted);text-align:center;padding:36px;border:1px dashed var(--line-2);border-radius:16px}
  .from{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:600 13px Poppins,sans-serif;flex:none}
  .msgcard{max-width:640px}
  .msgcard .hero{padding:24px 26px} .msgcard .hero h2{font-size:24px;margin-top:12px}
  .lbl{font:600 11px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .dl{display:inline-block;font:600 12.5px/1 Inter,sans-serif;padding:6px 10px;border-radius:99px;background:var(--bar);border:1px solid var(--line-2);color:var(--ink-2)}
  .dl.urg{background:#fdecea;border-color:#f3b9b4;color:#9e2a22}
  .flash{animation:flash 1.2s ease} @keyframes flash{0%{box-shadow:0 0 0 3px var(--brand)}100%{box-shadow:0 0 0 0 transparent}}

  /* charts */
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:8px 12px;font-size:13px} .seg button.on{background:var(--brand);color:var(--brand-ink)}
  svg.chart{width:100%;height:auto;display:block;overflow:visible}
  svg.chart text{font:12px Inter,sans-serif;fill:var(--muted)} svg.chart .lbl{fill:var(--ink);font-weight:600}
  svg.chart .risklbl{fill:var(--red);font-weight:600;font-size:11.5px}
  svg.chart .grid{stroke:var(--line);stroke-width:1} svg.chart .axis{stroke:var(--line-2);stroke-width:1}
  svg.chart .hit{fill:transparent;cursor:pointer}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .legend i.dia{border-radius:2px;transform:rotate(45deg)} .legend i.ring{background:transparent!important;border:2px solid var(--red)}
  #tip{position:fixed;pointer-events:none;z-index:20;background:var(--ink);color:var(--panel);font:12.5px/1.4 Inter,sans-serif;padding:8px 10px;border-radius:10px;max-width:260px;opacity:0;transition:opacity .1s}
  .cal{display:grid;gap:14px}
  .cal-year{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
  .cal-yh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 2px} .cal-yh b{font:600 15px Poppins,sans-serif}
  .cal-m{border:1px solid var(--line);border-radius:10px;padding:7px 8px;min-height:64px;background:var(--panel)}
  .cal-m.now{border-color:var(--brand);background:var(--bar)}
  .cal-m .mn{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .chip{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1.25 Inter,sans-serif;padding:3px 7px;border-radius:99px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);margin:3px 3px 0 0;cursor:pointer;text-align:left}
  .chip i{width:8px;height:8px;border-radius:50%;flex:none} .chip.risk{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
  .chip.ev{background:var(--sim);color:#fff;border-color:var(--sim)}
  .cal-detail{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bar);font-size:14px}
</style>
</head>
<body>
<div class="topbar">
  <span class="wordmark">Synapsis <span class="tag sim">Prototype</span></span>
  <nav class="views"><a href="#/inbox" id="nav-inbox">Advisor inbox</a><a href="/client/" id="nav-family">Client app ↗</a></nav>
</div>
<div class="sheet"><aside class="side" id="side"></aside><main id="app"><p class="empty">Loading…</p></main></div>
<script>
const STORE = "ftt-state-v1";
let DATA = null, state = {};
try { state = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const st = d => state[d.id] || {status: "pending", text: d.draft};
const names = d => d.household.names.join(" & ") + " " + d.household.surname;
const SHORT = {tech_selloff_2026_11: "Tech sell-off", layoffs_johnson_employer: "Layoffs at Daniel's employer", rate_cut_2026_11: "Fed rate cut",
               tax_limits_2027: "New contribution limits", home_prices_2026_11: "Home prices up 6%", tuition_2027: "Tuition up 5%"};
const short = e => SHORT[e.event_id] || e.headline;

// urgency x date of the goal at risk: sooner goal => higher priority
function priority(d) {
  let months = 120;
  if (d.goal_at_risk && d.goal_at_risk.date) {
    const [y, m] = d.goal_at_risk.date.split("-").map(Number);
    months = Math.max(1, (y - 2026) * 12 + ((m || 6) - 11));
  }
  return d.urgency_score * (1 + 12 / months);
}

let curEvent = null;
const evDrafts = id => DATA.drafts.filter(d => d.event_id === id);
const pendingOf = id => evDrafts(id).filter(d => st(d).status === "pending").length;
function goSec(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({behavior: "smooth", block: "start"}); }
function pickEvent(id) { curEvent = id; render(); window.scrollTo({top: 0}); }

/* ---------- left menu ---------- */
function sideInbox() {
  const types = {market: "Markets", law: "The law changes", life: "Family life"};
  let h = `<div class="grp">From your clients</div><button class="it ${curEvent === "__checkins" ? "" : "dim"}" onclick="pickEvent('__checkins')">Client check-ins<span class="n">calls &amp; changes</span></button>`;
  Object.entries(types).forEach(([t, label]) => {
    const evs = DATA.events.filter(e => e.type === t); if (!evs.length) return;
    h += `<div class="grp" style="margin-top:${h ? 18 : 0}px">${label}</div>`;
    evs.forEach(e => {
      const on = e.event_id === curEvent, p = pendingOf(e.event_id);
      h += `<button class="it ${on ? "" : "dim"}" onclick="pickEvent('${e.event_id}')">${esc(short(e))}<span class="n">${p ? p + " pending" : "done"}</span></button>`;
      if (on) {
        const ds = evDrafts(e.event_id).sort((a, b) => priority(b) - priority(a));
        h += `<div class="sub"><button data-sec="sec-overview" onclick="goSec('sec-overview')">Overview</button>
          <button data-sec="sec-urgency" onclick="goSec('sec-urgency')">Who needs you first</button>
          <button data-sec="sec-calendar" onclick="goSec('sec-calendar')">Plan calendar</button>
          <button data-sec="sec-drafts" onclick="goSec('sec-drafts')">Drafts to review</button>
          ${ds.map(d => `<button data-sec="card-${d.family_id}" onclick="goSec('card-${d.family_id}')" style="padding-left:36px;font-size:13.5px">${esc(names(d))}</button>`).join("")}</div>`;
      }
    });
  });
  return h;
}
function sideFamily(fid) {
  const fams = [...new Map(DATA.drafts.map(d => [d.family_id, d])).values()].sort((a, b) => FAM_ORDER.indexOf(a.family_id) - FAM_ORDER.indexOf(b.family_id));
  return `<div class="grp">Families</div>` + fams.map(d => {
    const on = d.family_id === fid, n = DATA.drafts.filter(x => x.family_id === d.family_id && st(x).status === "approved").length;
    return `<button class="it ${on ? "" : "dim"}" onclick="location.hash='#/family/${d.family_id}'">${esc(names(d))}<span class="n">${n} ${n === 1 ? "message" : "messages"}</span></button>` +
      (on ? `<div class="sub"><button data-sec="sec-messages" onclick="goSec('sec-messages')">Messages from your advisor</button><button data-sec="sec-updates" onclick="goSec('sec-updates')">Your updates</button><button data-sec="sec-talk" onclick="goSec('sec-talk')">Talk to us</button><button data-sec="sec-change" onclick="goSec('sec-change')">Report a change</button><button data-sec="sec-ask" onclick="goSec('sec-ask')">Ask about your plan</button><button data-sec="sec-plan" onclick="goSec('sec-plan')">Your plan, year by year</button></div>` : "");
  }).join("");
}

/* ---------- inbox ---------- */
function hero(ds, pending) {
  const ev = DATA.events.find(e => e.event_id === curEvent) || {};
  const high = ds.filter(d => d.affected === "high").length;
  return `<section id="sec-overview"><div class="hero"><span class="tag sim">Simulated ${esc(ev.type)} event</span>
    <h1 style="margin-top:16px">${esc(short(ev))}</h1>
    <p>${esc(ev.headline)}. Every affected family got a personal draft grounded in their own plan, ready for your approval.</p>
    <div class="stats"><div class="stat"><b>${ds.length}</b><span>${ds.length === 1 ? "family" : "families"} affected</span></div>
      <div class="stat"><b>${high}</b><span>high impact</span></div><div class="stat"><b>${pending}</b><span>waiting for you</span></div></div></div>
    <p class="fine">Synthetic families from the Sherpas case; the event dated ${esc(ev.date)} is simulated. No real messages are sent. Drafts were generated offline and checked so that every figure comes from the family's plan.</p></section>`;
}

/* ---------- advisor: client check-ins (AI call summaries + client-reported changes) ---------- */
let CHK = null;
function checkins() {
  const body = CHK === null ? `<div class="empty">Loading…</div>`
    : CHK.error ? `<div class="empty">${esc(CHK.error)}</div>` : checkinsBody();
  return `<section id="sec-overview"><div class="hero"><span class="tag sim">Simulated calls</span><h1 style="margin-top:16px">Client check-ins</h1>
      <p>After every AI call you get a 10-second summary: what matters, what the client asked for, and a suggested next step. If nothing needs doing, it says so. Changes that clients report in their app appear here too, to validate.</p></div>
    <div class="toolbar" style="margin-top:16px"><span class="meta">Calls are placed by an AI assistant that follows your rules: no advice, only plan figures, escalate anything important.</span><button onclick="loadCheckins(true)">Refresh</button></div></section>${body}`;
}
function checkinsBody() {
  const {calls, changes, kv} = CHK;
  const fam = fid => { const d = DATA.drafts.find(x => x.family_id === fid); return d ? names(d) : fid; };
  const badge = s => s.headline.includes("URGENT") ? `<span class="tag high">Urgent</span>` : s.all_good ? `<span class="tag" style="background:var(--green)">All good</span>` : `<span class="tag medium">To note</span>`;
  const when = t => new Date(t).toLocaleString("en", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
  // Layout from the team's advisor mockup: the first call that needs you is expanded (summary, transcript, requests,
  // Done); the rest are one-line rows you can open. Handled calls sink to the bottom.
  const first = n => (DATA.drafts.find(x => x.family_id === n) || {household: {names: [n]}}).household.names[0];
  const status = c => c.done ? ["Done", "var(--faint)"] : c.summary.headline.includes("URGENT") ? ["Urgent", "var(--red)"]
    : !c.summary.all_good && c.summary.client_asks !== "Nothing" ? ["Asks for something", "var(--amber)"]
    : !c.summary.all_good ? ["To note", "var(--amber)"] : ["No requests", "var(--green)"];
  const pill = c => { const [t, col] = status(c); return `<span style="font:600 12px/1 Inter,sans-serif;border-radius:99px;padding:6px 10px;background:color-mix(in srgb,${col} 14%,transparent);color:${col}">${t}</span>`; };
  const ordered = [...calls].sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
  if (chkOpen === null && ordered.length) chkOpen = (ordered.find(c => !c.done) || ordered[0]).key;
  const mins = c => Math.max(1, Math.round(((c.ended || c.started) - c.started) / 60000));
  const av = c => `<div class="avatar" style="width:40px;height:40px;background:var(--hero-a);color:var(--brand)">${esc(first(c.family_id)[0])}</div>`;
  const expandedCard = c => `<div class="card" style="border-radius:20px;display:flex;flex-direction:column;gap:14px">
      <div class="row" style="gap:12px">${av(c)}<div class="grow"><div class="fam" style="font-size:18px">${esc(first(c.family_id))} <span class="meta">· ${esc(fam(c.family_id))}</span></div>
        <div class="meta">${c.mode === "event" ? "Event call" : "Check-in call"} · ${mins(c)} min · ${when(c.ended || c.started)}</div></div>${pill(c)}</div>
      <div><div class="lbl">Summary</div><p style="margin:6px 0 0;font-size:15px;line-height:1.55">${esc(c.summary.headline.replace(/^[^:]+:\s*/, "").replace(/^./, ch => ch.toUpperCase()))}.${c.summary.key_points.length ? " " + c.summary.key_points.map(p => esc(p)).join(". ") + "." : ""} Client mood: ${esc(c.summary.emotion)}.</p></div>
      <details><summary style="list-style:none;cursor:pointer;min-height:44px;border:1px solid var(--line-2);border-radius:12px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:var(--brand);font-weight:600">Show full transcript <span aria-hidden="true">⌄</span></summary>
        <div class="note">${c.turns.map(t => `<div style="margin:4px 0"><b>${t.who === "ai" ? "AI" : esc(first(c.family_id))}:</b> ${esc(t.text)}</div>`).join("")}</div></details>
      <div><div class="lbl">Requests</div><ul style="margin:8px 0 0;padding-left:18px;font-size:15px;line-height:1.6">
        ${c.summary.client_asks !== "Nothing" ? `<li>${esc(c.summary.client_asks)}</li>` : `<li>No requests</li>`}<li><span class="meta">Suggested:</span> ${esc(c.summary.next_step)}</li></ul></div>
      <button class="${c.done ? "" : "primary"}" style="min-height:48px;border-radius:14px;font-size:16px" onclick="markDone('${c.key}', ${!c.done})">${c.done ? "Mark as not done" : "✓ Done"}</button></div>`;
  const row = c => `<button onclick="chkOpen='${c.key}';render()" style="width:100%;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;text-align:left;font:inherit;line-height:1.4">
      ${av(c)}<div class="grow" style="min-width:0"><div style="font-weight:600;font-size:16px">${esc(first(c.family_id))}</div>
      <div class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.summary.headline.replace(/^[^:]+:\s*/, ""))}</div></div>${pill(c)}</button>`;
  const callHtml = ordered.length ? ordered.map(c => c.key === chkOpen ? expandedCard(c) : row(c)).join("")

/* ---------- update frequency (per family) ----------
   Families choose how often they get personalized updates. Urgent alerts (urgency >= 70) always go out at once;
   everything else is bundled into the next scheduled update. Nothing is ever dropped ("always send something"). */
const TODAY = new Date(2026, 10, 21);                       // demo date = event date (simulated)

const URGENT = 70;
const freqOf = fid => (state.freq && state.freq[fid]) || "monthly";
function setFreq(fid, f) { state.freq = {...(state.freq || {}), [fid]: f}; save(); render(); const pin = getPin(); if (pin) api("/api/approvals", pin, {prefs: {freq: {[fid]: f}}}); }
function nextUpdate(fid) {
  // same rule as the client app: calls on Fridays; monthly = first Friday of next month
  const f = freqOf(fid);
  if (f === "monthly") { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 1); while (d.getDay() !== 5) d.setDate(d.getDate() + 1); return d; }
  const d = new Date(TODAY); do d.setDate(d.getDate() + 1); while (d.getDay() !== 5); return d;
}
const dayFmt = d => d.toLocaleDateString("en", {weekday: "short", day: "numeric", month: "short"});
const isUrgent = d => d.urgency_score >= URGENT;
const delivery = d => isUrgent(d) ? {urgent: true, text: "Urgent alert · sent as soon as you approve"}
                                  : {urgent: false, text: `In the ${UPD[freqOf(d.family_id)]} · ${dayFmt(nextUpdate(d.family_id))}`};
const UPD = {weekly: "weekly update", biweekly: "two-weekly update", monthly: "monthly update"};

const BRIEFS = {}, CHATS = {};

function chatLog(fid) {

}
async function chatSend(fid) {
  const el = document.getElementById("chat-in"), q = el.value.trim(); if (!q) return;
  const b = await brief(fid), t = q.toLowerCase(), A = b.advisor_first;
  const words = {home: ["home", "house", "mortgage"], cash: ["cash", "emergency", "savings", "reserve", "cushion"], college: ["college", "tuition", "university", "529", "school"],
                 market: ["market", "stock", "stocks", "invest", "portfolio", "tech", "nvidia"], retirement: ["retire", "retirement", "401"], debt: ["debt", "card", "loan"], tax: ["tax", "taxes"]};
  let a, pass = null;
  if (/\b(should i|should we|do i sell|sell|buy|move my money|what should)\b/.test(t)) { a = `That's exactly the kind of decision ${A} should help you with. Want me to send your question?`; pass = q; }
  else if (/next (update|check|call)|when.*(update|hear)/.test(t)) a = `Your next personalized update is ${dayFmt(nextUpdate(fid))}. Urgent alerts always reach you right away.`;
  else if (/next goal|goal|coming up|upcoming/.test(t)) a = `Coming up in your plan: ${b.upcoming_goal.name} ${b.upcoming_goal.when}.`;
  else { const k = Object.keys(words).find(k => b.topics[k] && words[k].some(w => t.includes(w))); if (k) a = b.topics[k];
         else { a = `I don't have that in front of me. Want me to send your question to ${A}?`; pass = q; } }
  CHATS[fid].push({who: "client", text: q}, {who: "ai", text: a, pass});

/* ---------- charts (hand-written SVG) ---------- */
const FAM_ORDER = ["carter", "johnson", "lewis", "weah"];           // fixed order, never cycled
const FAM_COLOR = {carter: "#4b55d0", johnson: "#0f9a7e", lewis: "#c7741a", weah: "#c2418a"};  // validated: CVD ΔE ≥ 11, contrast ≥ 3:1
const NOW = 2026 + 10 / 12;                                           // Nov 2026 (event date)
const famName = fid => { const d = DATA.drafts.find(x => x.family_id === fid); return d ? d.household.surname : fid; };
const money = v => v >= 1e6 ? "$" + (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + "M" : v >= 1e3 ? "$" + Math.round(v / 1e3) + "K" : "$" + v;
const dateNum = s => { const [y, m] = String(s).split("-").map(Number); return y + ((m || 6.5) - 1) / 12; };
const fmtDate = s => { const [y, m] = String(s).split("-"); return m ? new Date(+y, +m - 1).toLocaleString("en", {month: "short"}) + " " + y : y; };

let tipEl;
function tip(e, html) {
  tipEl = tipEl || Object.assign(document.body.appendChild(document.createElement("div")), {id: "tip"});
  if (!html) { tipEl.style.opacity = 0; return; }
  tipEl.innerHTML = html; tipEl.style.opacity = 1;
  const x = Math.min(e.clientX + 14, innerWidth - tipEl.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - tipEl.offsetHeight - 8);
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
}
const hov = html => `onmousemove="tip(event,this.dataset.t)" onmouseleave="tip(event)" data-t="${esc(html)}"`;
function goCard(fid) { const c = document.getElementById("card-" + fid); if (c) { c.scrollIntoView({behavior: "smooth", block: "center"}); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); } }

// 1) Urgency vs time to the goal at risk
function urgencyChart(ds) {
  const W = 860, H = 260, L = 46, R = 16, T = 16, B = 42, PR = W - R - 120;   // right band = "no dated goal"
  const months = d => Math.max(0.5, (dateNum(d.goal_at_risk.date) - NOW) * 12);
  const maxM = 240, sx = m => L + Math.sqrt(Math.min(m, maxM) / maxM) * (PR - L), sy = u => T + (1 - u / 100) * (H - T - B);
  const ticks = [[1, "1 mo"], [6, "6 mo"], [12, "1 yr"], [24, "2 yrs"], [60, "5 yrs"], [120, "10 yrs"], [240, "20 yrs"]];
  let g = "";
  [0, 25, 50, 75, 100].forEach(u => g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${sy(u)}" y2="${sy(u)}"/><text x="${L - 8}" y="${sy(u) + 4}" text-anchor="end">${u}</text>`);
  ticks.forEach(([m, t]) => g += `<line class="grid" x1="${sx(m)}" x2="${sx(m)}" y1="${T}" y2="${H - B}" stroke-dasharray="2 4"/><text x="${sx(m)}" y="${H - B + 18}" text-anchor="middle">${t}</text>`);
  g += `<line class="axis" x1="${PR + 30}" x2="${PR + 30}" y1="${T}" y2="${H - B}"/><text x="${(PR + 30 + W - R) / 2}" y="${H - B + 18}" text-anchor="middle">no dated goal</text>`;
  g += `<text x="${(L + PR) / 2}" y="${H - 4}" text-anchor="middle">time until the goal at risk →</text><text x="${L - 34}" y="${T + 4}" transform="rotate(-90 ${L - 34} ${T + 4})" text-anchor="end">urgency</text>`;
  ds.forEach(d => {
    const x = d.goal_at_risk ? sx(months(d)) : (PR + 30 + W - R) / 2, y = sy(d.urgency_score), c = FAM_COLOR[d.family_id], right = x > W - 150;
    const t = `<b>${esc(names(d))}</b><br>${d.affected} impact · urgency ${d.urgency_score}<br>${d.goal_at_risk ? "Goal at risk: " + esc(d.goal_at_risk.name) + ", " + fmtDate(d.goal_at_risk.date) : "No dated goal at risk"}<br><i>Click to open the draft</i>`;
    g += `<g onclick="goCard('${d.family_id}')" ${hov(t)} style="cursor:pointer"><circle cx="${x}" cy="${y}" r="16" class="hit"/>
      <circle cx="${x}" cy="${y}" r="7" fill="${c}" stroke="var(--panel)" stroke-width="2"/>
      <text class="lbl" x="${x + (right ? -12 : 12)}" y="${y + 4}" text-anchor="${right ? "end" : "start"}">${esc(famName(d.family_id))}</text></g>`;
  });
  return `<section id="sec-urgency"><h2>Who needs you first</h2><p class="lead">Urgency against how soon each family's goal at risk is. Top-left means call this week. Click a dot to open the draft.</p>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Urgency by time to goal">${g}</svg></section>`;
}

// 2) Plan calendar. Each draft's goal at risk is linked to the matching goal in the plan
//    (e.g. "Home purchase" = "Purchase a home"), so the red ring always sits on a real marker.
let calMode = "timeline", calSel = null;
const rkey = s => String(s).toLowerCase().replace(/[^a-z ]/g, " ").split(/\s+/).filter(w => w && !["purchase", "a", "for", "the", "of", "to"].includes(w)).sort().join(" ");
function calItems(ds) {
  const items = [];
  FAM_ORDER.forEach(fid => {
    const f = DATA.families[fid]; if (!f) return;
    f.goals.forEach(g => items.push({fid, kind: "goal", date: String(g.year), label: g.name, amount: g.amount}));
    f.retirement.forEach(r => items.push({fid, kind: "retire", date: r, label: "Retirement"}));
    const d = ds.find(x => x.family_id === fid), r = d && d.goal_at_risk;
    if (!r) return;
    const hits = items.filter(it => it.fid === fid && rkey(it.label) === rkey(r.name));
    if (hits.length) hits.forEach(it => { it.risk = true; if (it.kind === "goal" && r.date.includes("-")) it.date = r.date; });
    else items.push({fid, kind: "goal", date: r.date, label: r.name, risk: true, extra: true});
  });
  const ev = DATA.events.find(e => e.event_id === curEvent);
  if (ev) items.push({fid: null, kind: "event", date: ev.date.slice(0, 7), label: ev.headline});
  return items;
}
const itemHtml = it => `<b>${it.fid ? esc(famName(it.fid)) : "Simulated event"}</b> · ${esc(it.label)}<br>${fmtDate(it.date)}${it.amount ? " · " + money(it.amount) : ""}${it.risk ? '<br><span style="color:#ff8a80">At risk from this event</span>' : ""}`;

function planCalendar(ds) {
  const items = calItems(ds);
  return `<section id="sec-calendar"><div class="toolbar" style="margin:48px 0 0;align-items:flex-end"><h2 style="font-size:clamp(26px,3.4vw,40px);line-height:1.1">Plan calendar</h2>
    <div class="seg"><button class="${calMode === "timeline" ? "on" : ""}" onclick="calMode='timeline';render()">Whole plan</button><button class="${calMode === "months" ? "on" : ""}" onclick="calMode='months';render()">Next 2 years</button></div></div>
    <p class="lead" style="margin-top:6px">Every dated goal in the four plans and retirement dates. A red ring marks the goal this event puts at risk.</p>
    ${calMode === "timeline" ? timeline(items) : monthCal(items)}
    <div class="legend">${FAM_ORDER.map(f => `<span><i style="background:${FAM_COLOR[f]}"></i>${esc(famName(f))}</span>`).join("")}
      <span><i class="dia" style="background:var(--ink-2)"></i>Retirement</span><span><i class="ring"></i>Goal at risk from this event</span></div></section>`;
}

function timeline(items) {
  const W = 860, rowH = 48, L = 92, R = 16, T = 28, H = T + FAM_ORDER.length * rowH + 26;
  const y0 = 2026, y1 = 2049, sx = v => L + (v - y0) / (y1 - y0) * (W - L - R);
  let g = "";
  for (let y = y0; y <= y1; y += 2) g += `<line class="grid" x1="${sx(y)}" x2="${sx(y)}" y1="${T - 6}" y2="${H - 22}"/><text x="${sx(y)}" y="${H - 6}" text-anchor="middle">${y}</text>`;
  g += `<line x1="${sx(NOW)}" x2="${sx(NOW)}" y1="${T - 16}" y2="${H - 22}" stroke="var(--sim)" stroke-width="2" stroke-dasharray="4 3"/>
        <text x="${sx(NOW) + 6}" y="${T - 12}" style="fill:var(--sim);font-weight:600">today · simulated event</text>`;
  FAM_ORDER.forEach((fid, i) => {
    const cy = T + i * rowH + rowH / 2, c = FAM_COLOR[fid];
    g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${cy}" y2="${cy}"/><text class="lbl" x="${L - 10}" y="${cy + 4}" text-anchor="end">${esc(famName(fid))}</text>`;
    const mine = items.filter(it => it.fid === fid).sort((a, b) => (a.risk ? 1 : 0) - (b.risk ? 1 : 0));  // rings drawn on top
    mine.forEach(it => {
      const x = sx(dateNum(it.date)), t = itemHtml(it), click = it.risk ? `onclick="goCard('${fid}')" style="cursor:pointer"` : "";
      const mark = it.kind === "retire"
        ? `<rect x="${x - 6}" y="${cy - 6}" width="12" height="12" transform="rotate(45 ${x} ${cy})" fill="${c}" stroke="var(--panel)" stroke-width="2"/>`
        : `<circle cx="${x}" cy="${cy}" r="7" fill="${c}" stroke="var(--panel)" stroke-width="2"/>`;
      const ring = it.risk ? `<circle cx="${x}" cy="${cy}" r="13" fill="none" stroke="var(--red)" stroke-width="2"/>` : "";
      const lbl = it.extra ? `<text class="risklbl" x="${x + 18}" y="${cy + 4}">${esc(it.label)}</text>` : "";
      g += `<g ${hov(t)} ${click}>${mark}${ring}${lbl}<circle class="hit" cx="${x}" cy="${cy}" r="15"/></g>`;
    });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Goals timeline">${g}</svg>`;
}

function monthCal(items) {
  const MONTHS = 26, now = "2026-11", key = (y, m) => `${y}-${String(m).padStart(2, "0")}`;
  const chip = (it, i) => it.kind === "event"
    ? `<button class="chip ev" onclick="calSel=${i};render()">Event</button>`
    : `<button class="chip ${it.risk ? "risk" : ""}" onclick="calSel=${i};render()"><i style="background:${FAM_COLOR[it.fid]}"></i>${esc(famName(it.fid))}: ${it.risk ? "⚠ " : ""}${esc(it.label)}</button>`;
  let html = "", y = 2026, m = 11; const years = {};
  for (let k = 0; k < MONTHS; k++) { (years[y] = years[y] || []).push(m); if (++m > 12) { m = 1; y++; } }
  const idx = items.map((it, i) => [it, i]);
  Object.entries(years).forEach(([yy, ms]) => {
    const yearOnly = idx.filter(([it]) => it.date === yy);
    html += `<div><div class="cal-yh"><b>${yy}</b>${yearOnly.length ? `<span class="meta">during the year:</span>` + yearOnly.map(([it, i]) => chip(it, i)).join("") : ""}</div><div class="cal-year">` +
      ms.map(mm => { const k = key(yy, mm);
        return `<div class="cal-m ${k === now ? "now" : ""}"><div class="mn">${new Date(+yy, mm - 1).toLocaleString("en", {month: "short"})}</div>${idx.filter(([it]) => it.date === k).map(([it, i]) => chip(it, i)).join("")}</div>`;
      }).join("") + `</div></div>`;
  });
  const sel = calSel != null && items[calSel];
  return `<div class="cal">${html}</div><div class="cal-detail">${sel ? itemHtml(sel).replace('color:#ff8a80', 'color:var(--red)') + (sel.fid ? ` · <a href="javascript:goCard('${sel.fid}')">open draft</a>` : "") : "Click any item for details."}</div>`;
}

// 3) Family view: Living-map projection with goal markers + crosshair tooltip
function projMax(P) {   // round axis top: 4 gridlines on a 1/2/2.5/5 × 10^n step
  const raw = Math.max(...P.map(r => r.net_worth)) / 4, p = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map(k => k * p).find(s => s >= raw) * 4;
}
const PJ = {W: 760, H: 300, L: 56, R: 16, T: 34, B: 30};
function projectionChart(fid) {
  const f = DATA.families[fid]; if (!f) return "";
  const {W, H, L, R, T, B} = PJ, P = f.projection.filter(r => r.year <= 2060);
  const x0 = P[0].year, x1 = P[P.length - 1].year, maxV = projMax(P);
  const sx = v => L + (v - x0) / (x1 - x0) * (W - L - R), sy = v => T + (1 - Math.max(0, v) / maxV) * (H - T - B);
  const line = k => P.map((r, i) => `${i ? "L" : "M"}${sx(r.year).toFixed(1)},${sy(r[k]).toFixed(1)}`).join("");
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = maxV * i / 4; g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end">${money(Math.round(v))}</text>`; }
  for (let y = Math.ceil(x0 / 5) * 5; y <= x1; y += 5) g += `<text x="${sx(y)}" y="${H - 8}" text-anchor="middle">${y}</text>`;
  g += `<path d="${line("net_worth")}" fill="none" stroke="#4b55d0" stroke-width="2"/><path d="${line("investable")}" fill="none" stroke="#0f9a7e" stroke-width="2"/>`;
  // goals sit ON the net-worth line in the year they happen ("milestones along the way"), labelled directly
  const nwAt = yr => { const r = P.find(q => q.year === Math.round(yr)) || P[P.length - 1]; return r.net_worth; };
  const marks = [...f.goals.filter(gl => gl.year >= x0).map(gl => ({y: gl.year, t: gl.name, a: gl.amount, goal: true})),
                 ...f.retirement.slice(0, 1).map(r => ({y: Math.floor(dateNum(r)), t: "Retirement"}))].sort((a, b) => a.y - b.y);
  let lastX = -99, lift = 0;
  marks.forEach(mk => {
    const x = sx(mk.y), y = sy(nwAt(mk.y));
    lift = x - lastX < 70 ? lift + 16 : 0; lastX = x;                 // stagger labels of goals close in time
    const ly = y - 14 - lift, short = mk.t.replace("Purchase a ", "").replace(/^./, c => c.toUpperCase());
    const mark = mk.goal ? `<circle cx="${x}" cy="${y}" r="6" fill="var(--red)" stroke="var(--panel)" stroke-width="2"/>`
                         : `<rect x="${x - 6}" y="${y - 6}" width="12" height="12" transform="rotate(45 ${x} ${y})" fill="var(--ink-2)" stroke="var(--panel)" stroke-width="2"/>`;
    g += `<g ${hov(`<b>${esc(mk.t)}</b> · ${mk.y}${mk.a ? " · " + money(mk.a) : ""}<br>Projected net worth that year: ${money(nwAt(mk.y))}`)}>
      <line x1="${x}" x2="${x}" y1="${y}" y2="${H - B}" stroke="var(--line-2)" stroke-dasharray="3 3"/>${mark}
      <text x="${x}" y="${ly}" text-anchor="middle" style="fill:var(--ink-2);font-weight:600;font-size:11.5px">${esc(short)}${mk.a ? " " + money(mk.a) : ""}</text>
      <circle class="hit" cx="${x}" cy="${y}" r="13"/></g>`;
  });
  g += `<g id="xh" style="display:none"><line id="xh-l" y1="${T}" y2="${H - B}" stroke="var(--ink-2)"/><circle id="xh-a" r="4" fill="#4b55d0" stroke="var(--panel)" stroke-width="2"/><circle id="xh-b" r="4" fill="#0f9a7e" stroke="var(--panel)" stroke-width="2"/></g>`;
  g += `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" onmousemove="projHover(event,'${fid}')" onmouseleave="projHover(null)"/>`;
  return `<h2>Your plan, year by year</h2><p class="lead">Projected net worth and investable assets from your Sherpas living map, in future dollars, with your goals marked. A projection, not a promise.</p>
    <svg class="chart" id="proj" viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected net worth">${g}</svg>
    <div class="legend"><span><i style="background:#4b55d0"></i>Net worth</span><span><i style="background:#0f9a7e"></i>Investable assets</span><span><i style="background:var(--red)"></i>Goal (when it happens)</span><span><i class="dia" style="background:var(--ink-2)"></i>Retirement</span></div>`;
}
function projHover(e, fid) {
  const xh = document.getElementById("xh"); if (!xh) return;
  if (!e) { xh.style.display = "none"; tip(null); return; }
  const svg = document.getElementById("proj"), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const {W, H, L, R, T, B} = PJ, P = DATA.families[fid].projection.filter(r => r.year <= 2060);
  const x0 = P[0].year, x1 = P[P.length - 1].year, maxV = projMax(P);
  const yr = Math.round(x0 + (p.x - L) / (W - L - R) * (x1 - x0)), r = P.find(q => q.year === yr); if (!r) return;
  const sx = v => L + (v - x0) / (x1 - x0) * (W - L - R), sy = v => T + (1 - Math.max(0, v) / maxV) * (H - T - B);
  xh.style.display = ""; document.getElementById("xh-l").setAttribute("x1", sx(yr)); document.getElementById("xh-l").setAttribute("x2", sx(yr));
  const a = document.getElementById("xh-a"), b = document.getElementById("xh-b");
  a.setAttribute("cx", sx(yr)); a.setAttribute("cy", sy(r.net_worth)); b.setAttribute("cx", sx(yr)); b.setAttribute("cy", sy(r.investable));
  tip(e, `<b>${yr}</b><br>Net worth ${money(r.net_worth)}<br>Investable ${money(r.investable)}`);
}

/* ---------- render + scroll-spy for the left menu ---------- */
let spy;
function render() {
  const [, view = "inbox", arg] = location.hash.split("/");
  const fid = arg || "carter";
  curEvent = curEvent || DATA.events[0].event_id;
  document.getElementById("nav-inbox").className = view === "inbox" ? "on" : "";
  document.getElementById("nav-family").className = view === "family" ? "on" : "";
  document.getElementById("side").innerHTML = view === "family" ? sideFamily(fid) : sideInbox();
  document.getElementById("app").innerHTML = view === "family" ? family(fid) : inbox();
  if (spy) spy.disconnect();
  const btns = [...document.querySelectorAll(".side .sub button[data-sec]")];
  spy = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    btns.forEach(b => b.classList.toggle("on", b.dataset.sec === e.target.id));
  }), {rootMargin: "-20% 0px -70% 0px"});
  btns.forEach(b => { const el = document.getElementById(b.dataset.sec); if (el) spy.observe(el); });
}
// Demo PIN (same as CALL_PIN) guards calls and the shared records; kept only for this browser session.
function getPin() {
  let pin = ""; try { pin = sessionStorage.getItem("ftt-pin") || ""; } catch (e) {}
  if (!pin) { pin = (prompt("Demo PIN:") || "").trim(); if (pin) try { sessionStorage.setItem("ftt-pin", pin); } catch (e) {} }
  return pin;
}
function forgetPin() { try { sessionStorage.removeItem("ftt-pin"); } catch (e) {} }
async function api(path, pin, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"content-type": "application/json", "x-pin": pin}, body: JSON.stringify(body)} : {headers: {"x-pin": pin}});
  return r.json().catch(() => ({ok: false, error: "Server error " + r.status}));
}
// Real, interactive phone call through /api/call -> Twilio -> /api/voice on every turn.
async function startCall(payload, btn, outId) {
  const out = document.getElementById(outId), pin = getPin(); if (!pin) return;
  btn.disabled = true; out.textContent = "Calling…";
  try {
    const r = await fetch("/api/call", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({...payload, pin})});
    const j = await r.json().catch(() => ({}));
    if (j.ok) { out.textContent = `📞 Ringing ${j.to} now. Pick up and talk to the assistant; the summary appears in the advisor's "Client check-ins".`; CHK = null; }
    else { out.textContent = "Couldn't call: " + (j.error || r.status); if (r.status === 401) forgetPin(); }
  } catch (e) { out.textContent = "Couldn't reach the call service."; }
  btn.disabled = false;
}
const callMe = (id, btn) => startCall({mode: "event", id}, btn, "call-" + id);
/* Approvals are shared through the server (KV) so the client app on any device sees them; localStorage is only a cache. */
function toast(t) {
  let el = document.getElementById("toast");
  if (!el) { el = Object.assign(document.createElement("div"), {id: "toast"}); el.style.cssText = "position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-size:13.5px;z-index:30;transition:opacity .2s"; document.body.appendChild(el); }
  el.textContent = t; el.style.opacity = 1; clearTimeout(el._t); el._t = setTimeout(() => el.style.opacity = 0, 2600);
}
async function syncApprovals(ids, reset) {
  const pin = getPin(); if (!pin) { toast("Saved on this device only (no PIN)"); return; }
  const approvals = Object.fromEntries(ids.map(id => [id, state[id] && ["approved", "rejected"].includes(state[id].status) ? state[id] : null]));
  const r = await api("/api/approvals", pin, reset ? {reset: true} : {approvals});
  if (r.ok) toast(reset ? "Reset for everyone" : "Saved · the client app sees it now");
  else { toast("Couldn't save to the server: " + (r.error || "error")); if (r.error === "Wrong PIN") forgetPin(); }
}
async function pullShared() {
  try {
    const r = await (await fetch("/api/approvals", {cache: "no-store"})).json();
    if (!r.ok || !r.kv) return;
    DATA.drafts.forEach(d => {
      const v = r.approvals[d.id], local = state[d.id];
      if (v) state[d.id] = {status: v.status, text: v.text || d.draft};
      else if (local && local.status !== "editing") delete state[d.id];
    });
    state.freq = {...(state.freq || {}), ...r.prefs.freq}; state.time = {...(state.time || {}), ...r.prefs.time};
    save(); render();
  } catch (e) {}
}
function setStatus(id, s) { const d = DATA.drafts.find(x => x.id === id); state[id] = {...st(d), status: s}; save(); render(); if (s !== "editing") syncApprovals([id]); }
function saveEdit(id) { state[id] = {status: "approved", text: document.getElementById("ta-" + id).value}; save(); render(); syncApprovals([id]); }
function approveAll() { const ids = []; evDrafts(curEvent).forEach(d => { if (st(d).status === "pending") { state[d.id] = {...st(d), status: "approved"}; ids.push(d.id); } }); save(); render(); if (ids.length) syncApprovals(ids); }
function resetAll() { DATA.drafts.forEach(d => delete state[d.id]); save(); render(); syncApprovals([], true); }

window.addEventListener("hashchange", () => { render(); window.scrollTo({top: 0}); });
window.addEventListener("focus", () => DATA && pullShared());
fetch("/data/drafts.json").then(r => r.json()).then(j => { DATA = j; render(); pullShared(); })
  .catch(() => document.getElementById("app").innerHTML = '<p class="empty">Could not load data/drafts.json</p>');
</script>
